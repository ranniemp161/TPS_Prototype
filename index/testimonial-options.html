<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Testimonial options</title>
<!--
  A comparison page for Ami (TJ, 17 Nov 2026): the testimonials as they are
  now, then three at once, then two at once, each still a carousel. It is
  not linked from any menu. It loads site.css, so the master number and the
  text unit size everything exactly as on the home page; once Ami picks one,
  that version is built into the home page and this page can go.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="css/site.css" />
<link rel="stylesheet" href="css/testimonial-options.css?v=3" />
</head>
<body class="tvo">
<main>

  <!-- ============ CURRENT ============ -->
  <p class="tvo__label">Current</p>
  <section class="act act--voices" aria-labelledby="voices-heading">
    <div class="voices">
      <div class="aurora aurora--voices" aria-hidden="true"><span class="aurora__field"></span></div>
      <div class="tv2" data-tv2>
        <header class="tv2__head">
          <h2 class="tv2__title" id="voices-heading">Testimonials</h2>
          <p class="tv2__script">What our clients say about us.</p>
        </header>
        <button class="tv2__nav tv2__nav--prev" type="button" data-tv2-prev aria-label="Previous testimonial">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.5 5.5 8 12l6.5 6.5" /></svg>
        </button>
        <button class="tv2__nav tv2__nav--next" type="button" data-tv2-next aria-label="Next testimonial">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.5 5.5 16 12l-6.5 6.5" /></svg>
        </button>
        <div class="tv2__main">
          <blockquote class="tv2__quote" data-tv2-quote></blockquote>
          <div class="tv2__by">
            <div class="tv2__meta" data-tv2-meta>
              <span class="tv2__rule" aria-hidden="true"></span>
              <span class="tv2__name" data-tv2-name></span>
              <span class="tv2__role" data-tv2-role></span>
            </div>
          </div>
          <div class="tv2__car" data-tv2-car>
            <span class="tv2__track-line" aria-hidden="true"></span>
            <span class="tv2__fill" aria-hidden="true"></span>
            <div class="tv2__track" data-tv2-track></div>
            <span class="tv2__tip" aria-hidden="true"></span>
          </div>
          <p class="tv2__sr" aria-live="polite" data-tv2-live></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ THREE ============ -->
  <p class="tvo__label">Three</p>
  <section class="act act--voices" aria-labelledby="voices-three">
    <div class="voices">
      <div class="aurora aurora--voices" aria-hidden="true"><span class="aurora__field"></span></div>
      <div class="tvm tvm--3" data-tvm="3">
        <header class="tv2__head">
          <h2 class="tv2__title" id="voices-three">Testimonials</h2>
          <p class="tv2__script">What our clients say about us.</p>
        </header>
        <div class="tvm__stage">
          <button class="tv2__nav tv2__nav--prev" type="button" data-tvm-prev aria-label="Previous testimonial">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.5 5.5 8 12l6.5 6.5" /></svg>
          </button>
          <button class="tv2__nav tv2__nav--next" type="button" data-tvm-next aria-label="Next testimonial">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.5 5.5 16 12l-6.5 6.5" /></svg>
          </button>
          <div class="tvm__cols" data-tvm-cols></div>
        </div>
        <div class="tv2__car tvm__car" data-tvm-car>
          <span class="tv2__track-line" aria-hidden="true"></span>
          <span class="tv2__fill" aria-hidden="true"></span>
          <div class="tv2__track" data-tvm-line></div>
          <span class="tv2__tip" aria-hidden="true"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ TWO ============ -->
  <p class="tvo__label">Two</p>
  <section class="act act--voices" aria-labelledby="voices-two">
    <div class="voices">
      <div class="aurora aurora--voices" aria-hidden="true"><span class="aurora__field"></span></div>
      <div class="tvm tvm--2" data-tvm="2">
        <header class="tv2__head">
          <h2 class="tv2__title" id="voices-two">Testimonials</h2>
          <p class="tv2__script">What our clients say about us.</p>
        </header>
        <div class="tvm__stage">
          <button class="tv2__nav tv2__nav--prev" type="button" data-tvm-prev aria-label="Previous testimonial">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.5 5.5 8 12l6.5 6.5" /></svg>
          </button>
          <button class="tv2__nav tv2__nav--next" type="button" data-tvm-next aria-label="Next testimonial">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.5 5.5 16 12l-6.5 6.5" /></svg>
          </button>
          <div class="tvm__cols" data-tvm-cols></div>
        </div>
        <div class="tv2__car tvm__car" data-tvm-car>
          <span class="tv2__track-line" aria-hidden="true"></span>
          <span class="tv2__fill" aria-hidden="true"></span>
          <div class="tv2__track" data-tvm-line></div>
          <span class="tv2__tip" aria-hidden="true"></span>
        </div>
      </div>
    </div>
  </section>

</main>
<script src="js/testimonial-options.js?v=3"></script>
</body>
</html>
